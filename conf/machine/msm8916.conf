#@TYPE: Machine
#@NAME: MSM8916 MTP
#@DESCRIPTION: Machine configuration for Qualcomm MSM8916 MTP

# Uncomment the following line to enable the hard floating point abi. Note that
# this breaks some binary libraries and 3D (neither of which ship with
# meta-yocto). For maximum compatibility, leave this disabled.
#DEFAULTTUNE ?= "cortexa8hf-neon"

include conf/machine/include/tune-cortexa8.inc

#SDKGCCVERSION="4.6%"
#GCCVERSION="4.6%"

MACHINE_DISPLAY_WIDTH_PIXELS = "480"
MACHINE_DISPLAY_HEIGHT_PIXELS = "800"

SERIAL_CONSOLE = "115200 ttyO2"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-quic"

MACHINE_FEATURES += "kernel26"
MACHINE_FEATURES += "keyboard"

#Specify chipset family
OVERRIDES =. "b-family:"

# Provide a config baseline for things so the kernel will build...
KERNEL_DEFCONFIG ?= "msm8916-512mb_defconfig"
MACHINE_DTS_NAME = "*8*16"

# fastboot image configuration
MACHINE_CONSOLE = "ttyHSL0"
MACHINE_ROOTDEV = "/dev/mmcblk0p23"
MACHINE_KERNEL_BASE = "0x80000000"
MACHINE_KERNEL_TAGS_OFFSET = "0x01E00000"
MACHINE_FLASH_PAGE_SIZE = "2048"
MACHINE_KERNEL_VERSION = `sed -r 's/#define UTS_RELEASE "(.*)"/\1/' ${STAGING_KERNEL_DIR}/include/generated/utsrelease.h`
BOOTIMAGE_PARTITION_SIZE = 16777216
SYSTEMIMAGE_PARTITION_SIZE = 838860800
USERDATAIMAGE_PARTITION_SIZE = 2631680000
TARGET_SHA_TYPE = sha256
PRODUCT_PRIVATE_KEY = device/qcom/common/qcom.key

#Enable X11
DISTRO_FEATURES += "x11"

#Enable emmc boot
DISTRO_FEATURES += "emmc-boot"

#Enable signed kernel
DISTRO_FEATURES += "signed-kernel"

#Device manager
VIRTUAL-RUNTIME_dev_manager = "udev"

#Busybox
PREFERRED_VERSION_busybox = "1.19.3"
PREFERRED_VERSION_busybox-static = "1.19.3"

#Enable rpm packaging
PACKAGE_CLASSES += " package_rpm"

